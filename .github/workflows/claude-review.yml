name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  review:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # persist-credentials は既定の true のままにする。tag モードは作業ブランチを
      # 作るために checkout が残す認証情報で git fetch / push を行うため、false に
      # すると "could not read Username for https://github.com" で失敗する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 公開リポジトリなので、Claude が読むコメントをメンテナー本人のものに限る。
          # 第三者のコメントに書かれた指示でリポジトリを書き換えられないようにするため（間接プロンプトインジェクション対策）
          include_comments_by_actor: HTNCode
